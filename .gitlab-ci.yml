stages:
  - build
  - test
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: "Release"
  EC2_USER: "ubuntu"
  EC2_BACKEND_PATH: "/opt/xenoh/Xenoh_be"
  EC2_COMPOSE_PATH: "/opt/xenoh/deploy/aws-ec2"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore Xenoh.slnx
    - dotnet build Xenoh.slnx -c "$CONFIGURATION" --no-restore
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/**/bin/
      - tests/**/bin/

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - build
  script:
    - dotnet test Xenoh.slnx -c "$CONFIGURATION" --no-build --logger "trx;LogFileName=test-results.trx"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/**/TestResults/*.trx

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - printf "%s" "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >
      ssh "$EC2_USER@$EC2_HOST"
      "set -e;
      cd '$EC2_BACKEND_PATH';
      git fetch origin;
      git checkout '$CI_COMMIT_BRANCH';
      git reset --hard 'origin/$CI_COMMIT_BRANCH';
      cd '$EC2_COMPOSE_PATH';
      docker compose up -d --build;
      docker image prune -f;
      docker ps --filter name=xenoh-api"
