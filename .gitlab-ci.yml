stages:
  - build
  - test
  - package
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: "Release"
  EC2_USER: "ubuntu"
  EC2_COMPOSE_PATH: "/opt/xenoh/deploy/aws-ec2"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore Xenoh.slnx
    - dotnet build Xenoh.slnx -c "$CONFIGURATION" --no-restore
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/**/bin/
      - tests/**/bin/

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - build
  script:
    - dotnet test Xenoh.slnx -c "$CONFIGURATION" --no-build --logger "trx;LogFileName=test-results.trx"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/**/TestResults/*.trx

# Build the production Docker image on a GitLab shared runner (docker-in-docker)
# and push it to this project's GitLab Container Registry. Moving the heavy .NET
# image build OFF the EC2 box is what fixes the recurring "no space left on
# device": EC2 no longer needs the SDK image, build cache, or publish output —
# it only pulls a ~400 MB runtime image.
build_image:
  stage: package
  image: docker:27
  services:
    # Lower the dind bridge MTU. GitLab.com's runner network uses a smaller MTU
    # than dind's 1500 default; large packets (e.g. NuGet restore over TLS) get
    # silently dropped and hang until timeout (NU1301). 1400 stays under it.
    - name: docker:27-dind
      command: ["--mtu=1400"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Use the legacy builder, which runs the build on the daemon's bridge and so
    # honors the --mtu above. BuildKit uses its own network that ignores --mtu,
    # which is why the restore hangs with the default (BuildKit) builder.
    DOCKER_BUILDKIT: "0"
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # $CI_REGISTRY_IMAGE = registry.gitlab.com/lutanfuu/xenoh
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - printf "%s" "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # EC2 no longer builds. It pulls the image just pushed by build_image and
    # recreates the container; a single image prune drops the previous tag so
    # old images do not pile up. EC2 authenticates to the registry via a
    # persistent Deploy Token login set up once on the host (see
    # docs/aws-ec2-deployment.md, Section 7) — so this job carries no registry
    # credentials and never touches the host's docker login.
    - >
      ssh "$EC2_USER@$EC2_HOST"
      "set -e;
      cd '$EC2_COMPOSE_PATH';
      docker compose pull;
      docker compose up -d --remove-orphans;
      docker image prune -f;
      docker ps --filter name=xenoh-api"
